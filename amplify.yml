version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - printf '%s\n' "ADMIN_PASSWORD=$ADMIN_PASSWORD" "ADMIN_SESSION_SECRET=$ADMIN_SESSION_SECRET" "GITHUB_TOKEN=$GITHUB_TOKEN" "GITHUB_REPO=$GITHUB_REPO" "GITHUB_BRANCH=$GITHUB_BRANCH" > .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
